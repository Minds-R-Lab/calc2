<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Generator — Calculus II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="course-config.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --radius: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  }

  /* Top Navigation */
  nav{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:1000;padding:0.6rem 1.5rem;display:flex;align-items:center;gap:1.5rem;font-size:0.9rem;}
  nav a{text-decoration:none;color:var(--text-muted);font-weight:500;transition:color 0.2s;}
  nav a:hover{color:var(--primary);}
  nav .brand{font-weight:800;color:var(--primary);font-size:1.05rem;letter-spacing:-0.02em;}
  nav .active{color:var(--accent);font-weight:700;}

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 35%, #3b82f6 65%, #7c3aed 100%);
    color: #fff; padding: 0; text-align: center;
    position: relative; overflow: hidden; min-height: 320px; margin-top: 60px;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 50%, rgba(59,130,246,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 500px 350px at 80% 40%, rgba(124,58,237,0.15) 0%, transparent 70%);
  }
  .hero-inner {
    position: relative; z-index: 2; max-width: 1100px; margin: 0 auto;
    padding: 3rem 2rem; text-align: left;
  }
  .hero h1 {
    font-size: 2.8rem; font-weight: 800; margin-bottom: 0.5rem;
    line-height: 1.15; letter-spacing: -0.02em;
  }
  .hero h1 .highlight {
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f9a8d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero .subtitle {
    font-size: 1.1rem; opacity: 0.85; max-width: 600px; margin: 0.5rem 0 0; line-height: 1.6;
  }

  /* Container */
  .container { max-width: 1100px; margin: 0 auto; padding: 3rem 4rem; }

  /* Section headers */
  .section-header { margin-bottom: 0.5rem; }
  .section-header h2 { font-size: 1.6rem; font-weight: 700; color: var(--text); }
  .section-header p { color: var(--text-muted); font-size: 1rem; margin-top: 0.25rem; }

  /* Chapter selection grid */
  .chapter-select-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem; margin: 2rem 0 3rem 0;
  }
  .chapter-select-btn {
    padding: 1.25rem; border-radius: 12px; border: 2.5px solid var(--border);
    background: #fff; cursor: pointer; transition: all 0.2s;
    font-weight: 600; font-size: 0.95rem; text-align: center;
    color: var(--text);
  }
  .chapter-select-btn:hover {
    border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg);
  }
  .chapter-select-btn.selected {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  .chapter-select-badge {
    display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem;
    opacity: 0.7;
  }
  .chapter-select-btn.selected .chapter-select-badge {
    opacity: 1;
  }

  /* Generate button */
  .generate-section {
    display: flex; gap: 1rem; align-items: center; margin: 2rem 0 3rem 0;
    flex-wrap: wrap;
  }
  #generate-btn {
    padding: 0.9rem 2.5rem; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff; transition: all 0.2s; box-shadow: var(--shadow-lg);
  }
  #generate-btn:hover {
    transform: translateY(-2px); box-shadow: 0 15px 35px rgba(59,130,246,0.3);
  }
  #generate-btn:active {
    transform: translateY(0);
  }
  .question-count {
    color: var(--text-muted); font-size: 0.95rem;
  }

  /* Exam display area */
  .exam-display {
    background: var(--card); border-radius: var(--radius);
    border: 1.5px solid var(--border); padding: 2.5rem;
    box-shadow: var(--shadow);
  }
  .exam-display.hidden {
    display: none;
  }

  /* Question styling */
  .question-container {
    margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);
  }
  .question-container:last-child {
    border-bottom: none;
  }

  .question-number {
    display: inline-block; background: var(--primary); color: #fff;
    padding: 0.4rem 0.9rem; border-radius: 8px; font-weight: 700;
    font-size: 0.85rem; margin-bottom: 0.75rem;
  }

  .question-text {
    font-size: 1.05rem; font-weight: 600; margin: 0.75rem 0;
    line-height: 1.7;
  }

  /* MC styling */
  .mc-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0;
  }
  .mc-option {
    padding: 1rem; border: 1.5px solid var(--border); border-radius: 10px;
    background: #fff; cursor: pointer; transition: all 0.2s;
    font-weight: 500;
  }
  .mc-option:hover:not(.disabled) {
    border-color: var(--primary); background: var(--primary-light);
  }
  .mc-option.selected-correct {
    border-color: var(--success); background: #d1fae5; font-weight: 700;
  }
  .mc-option.selected-wrong {
    border-color: var(--danger, #ef4444); background: #fee2e2; font-weight: 700;
  }
  .mc-option.correct-highlight {
    border-color: var(--success); background: #d1fae5;
  }
  .mc-option.disabled {
    cursor: default; opacity: 0.85;
  }

  /* Solution box — hidden by default */
  .solution-box {
    margin-top: 2rem; padding: 1.5rem; border-left: 4px solid var(--accent);
    background: var(--accent-light); border-radius: 8px; font-size: 0.95rem;
    line-height: 1.8; display: none;
  }
  .solution-box.visible {
    display: block;
  }
  .solution-label {
    font-weight: 700; color: var(--accent); margin-bottom: 0.5rem;
  }

  /* Show Solution button */
  .show-solution-btn {
    margin-top: 1.5rem; padding: 0.7rem 1.8rem; font-size: 0.9rem;
    font-weight: 600; border: 2px solid var(--accent); border-radius: 8px;
    background: transparent; color: var(--accent); cursor: pointer;
    transition: all 0.2s;
  }
  .show-solution-btn:hover {
    background: var(--accent); color: #fff;
  }

  /* Footer */
  footer {
    background: var(--text); color: #fff; padding: 2rem 1.5rem; text-align: center;
    margin-top: 4rem; font-size: 0.9rem;
  }

  @media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
    .chapter-select-grid { grid-template-columns: 1fr; }
    .mc-options { grid-template-columns: 1fr; }
    .generate-section { flex-direction: column; align-items: flex-start; }
    #generate-btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <a href="index.html" class="brand">Calc 2</a>
  <a href="index.html">Home</a>

<!-- Hero Section -->
<div class="hero">
  <div class="hero-inner">
    <h1>Exam <span class="highlight">Generator</span></h1>

  </div>
</div>

<div class="container">
  <!-- Chapter Selection -->
  <div class="section-header">
    <h2>Select Chapters</h2>
    <p>Choose which chapters to include in your exam</p>
  </div>
  <div class="chapter-select-grid" id="chapter-select-grid"></div>

  <!-- Generate Section -->
  <div class="generate-section">
    <button id="generate-btn">Generate Exam</button>
    <span class="question-count">
      <strong id="selected-count">0</strong> chapters selected
    </span>
  </div>

  <!-- Exam Display Area -->
  <div class="exam-display hidden" id="exam-display"></div>
</div>

<footer id="main-footer"></footer>

<script>
/* ── Problem Database ── */
const PROBLEMS = [
  // ==================== CHAPTER 1: Integration Techniques ====================
  {
    type: "mc",
    chapter: "ch1",
    statement: "Find $$\\int x\\cos x\\,dx$$",
    choices: [
      "$$x\\sin x + \\cos x + C$$",
      "$$x\\sin x - \\cos x + C$$",
      "$$x\\cos x - \\sin x + C$$",
      "$$\\frac{x^2\\sin x}{2} + C$$"
    ],
    correct: "A",
    explanation: "Using integration by parts with $u = x$, $dv = \\cos x\\,dx$: We get $du = dx$, $v = \\sin x$. By the formula $\\int u\\,dv = uv - \\int v\\,du$, we have $$\\int x\\cos x\\,dx = x\\sin x - \\int \\sin x\\,dx = x\\sin x + \\cos x + C$$"
  },
  {
    type: "mc",
    chapter: "ch1",
    statement: "Find $$\\int \\sin^3 x\\,dx$$",
    choices: [
      "$$-\\cos x + \\frac{\\cos^3 x}{3} + C$$",
      "$$\\cos x - \\frac{\\cos^3 x}{3} + C$$",
      "$$-\\cos x - \\frac{\\cos^3 x}{3} + C$$",
      "$$\\sin x + \\frac{\\sin^3 x}{3} + C$$"
    ],
    correct: "A",
    explanation: "Rewrite $\\sin^3 x = \\sin x(1 - \\cos^2 x)$. Let $u = \\cos x$, $du = -\\sin x\\,dx$. Then $$\\int \\sin^3 x\\,dx = \\int (1 - u^2)(-du) = -u + \\frac{u^3}{3} + C = -\\cos x + \\frac{\\cos^3 x}{3} + C$$"
  },
  {
    type: "mc",
    chapter: "ch1",
    statement: "For $$\\int \\frac{dx}{\\sqrt{9-x^2}}$$, which substitution is appropriate?",
    choices: [
      "$$x = 3\\sin\\theta$$",
      "$$x = 3\\tan\\theta$$",
      "$$x = 3\\sec\\theta$$",
      "$$x = \\sqrt{9-\\theta}$$"
    ],
    correct: "A",
    explanation: "For integrals of the form $\\int \\frac{dx}{\\sqrt{a^2 - x^2}}$, use $x = a\\sin\\theta$. Here $a = 3$, so $x = 3\\sin\\theta$ is the standard substitution."
  },
  {
    type: "mc",
    chapter: "ch1",
    statement: "Decompose $$\\frac{5x+7}{(x+1)(x+2)}$$ into partial fractions.",
    choices: [
      "$$\\frac{2}{x+1} + \\frac{3}{x+2}$$",
      "$$\\frac{3}{x+1} + \\frac{2}{x+2}$$",
      "$$\\frac{5}{x+1} - \\frac{1}{x+2}$$",
      "$$\\frac{1}{x+1} + \\frac{4}{x+2}$$"
    ],
    correct: "A",
    explanation: "Set up $\\frac{5x+7}{(x+1)(x+2)} = \\frac{A}{x+1} + \\frac{B}{x+2}$. Multiplying both sides by $(x+1)(x+2)$: $5x+7 = A(x+2) + B(x+1)$. At $x = -1$: $-5+7 = 2 = A(1)$, so $A = 2$. At $x = -2$: $-10+7 = -3 = B(-1)$, so $B = 3$. Therefore $\\frac{5x+7}{(x+1)(x+2)} = \\frac{2}{x+1} + \\frac{3}{x+2}$."
  },
  {
    type: "free",
    chapter: "ch1",
    statement: "Evaluate $$\\int x^2 e^x\\,dx$$ using integration by parts (twice).",
    solution: "Use integration by parts with $u = x^2$, $dv = e^x dx$, so $du = 2x\\,dx$, $v = e^x$. Then:\n$$\\int x^2 e^x\\,dx = x^2 e^x - \\int 2xe^x\\,dx$$\n\nApply integration by parts again to $\\int 2xe^x\\,dx$ with $u = 2x$, $dv = e^x dx$:\n$$\\int 2xe^x\\,dx = 2xe^x - \\int 2e^x\\,dx = 2xe^x - 2e^x$$\n\nCombining:\n$$\\int x^2 e^x\\,dx = x^2 e^x - (2xe^x - 2e^x) = e^x(x^2 - 2x + 2) + C$$"
  },
  {
    type: "free",
    chapter: "ch1",
    statement: "Evaluate $$\\int \\sin^2 x\\cos^3 x\\,dx$$",
    solution: "Rewrite $\\cos^3 x = \\cos x(1 - \\sin^2 x)$, so:\n$$\\int \\sin^2 x\\cos^3 x\\,dx = \\int \\sin^2 x\\cos x(1 - \\sin^2 x)\\,dx$$\n\nLet $u = \\sin x$, $du = \\cos x\\,dx$:\n$$= \\int u^2(1 - u^2)\\,du = \\int (u^2 - u^4)\\,du$$\n$$= \\frac{u^3}{3} - \\frac{u^5}{5} + C = \\frac{\\sin^3 x}{3} - \\frac{\\sin^5 x}{5} + C$$"
  },
  {
    type: "free",
    chapter: "ch1",
    statement: "Evaluate $$\\int \\frac{x^2}{\\sqrt{4-x^2}}\\,dx$$ using trig substitution.",
    solution: "Let $x = 2\\sin\\theta$, so $dx = 2\\cos\\theta\\,d\\theta$ and $\\sqrt{4-x^2} = 2\\cos\\theta$:\n$$\\int \\frac{x^2}{\\sqrt{4-x^2}}\\,dx = \\int \\frac{4\\sin^2\\theta}{2\\cos\\theta} \\cdot 2\\cos\\theta\\,d\\theta = 4\\int \\sin^2\\theta\\,d\\theta$$\n\nUsing $\\sin^2\\theta = \\frac{1-\\cos(2\\theta)}{2}$:\n$$= 4\\int \\frac{1-\\cos(2\\theta)}{2}\\,d\\theta = 2\\left(\\theta - \\frac{\\sin(2\\theta)}{2}\\right) + C$$\n$$= 2\\theta - \\sin(2\\theta) + C = 2\\arcsin\\frac{x}{2} - 2\\sin\\theta\\cos\\theta + C$$\n$$= 2\\arcsin\\frac{x}{2} - \\frac{x\\sqrt{4-x^2}}{2} + C$$"
  },
  {
    type: "free",
    chapter: "ch1",
    statement: "Evaluate $$\\int \\frac{3x^2+x+1}{x(x^2+1)}\\,dx$$ using partial fractions.",
    solution: "Set up the decomposition:\n$$\\frac{3x^2+x+1}{x(x^2+1)} = \\frac{A}{x} + \\frac{Bx+C}{x^2+1}$$\n\nMultiplying by $x(x^2+1)$:\n$$3x^2+x+1 = A(x^2+1) + (Bx+C)x$$\n\nAt $x = 0$: $1 = A \\Rightarrow A = 1$\n\nExpanding: $3x^2 + x + 1 = Ax^2 + A + Bx^2 + Cx = (A+B)x^2 + Cx + A$\n\nComparing coefficients: $A = 1$, $A+B = 3 \\Rightarrow B = 2$, $C = 1$\n\n$$\\int \\frac{3x^2+x+1}{x(x^2+1)}\\,dx = \\int \\frac{1}{x}\\,dx + \\int \\frac{2x+1}{x^2+1}\\,dx$$\n$$= \\ln|x| + \\ln(x^2+1) + \\arctan x + C$$"
  },
  {
    type: "mc",
    chapter: "ch1",
    statement: "Find $$\\int \\sec^2 x \\tan x\\,dx$$",
    choices: [
      "$$\\frac{\\tan^2 x}{2} + C$$",
      "$$\\frac{\\sec^2 x}{2} + C$$",
      "$$\\tan x - x + C$$",
      "$$\\sec x + C$$"
    ],
    correct: "A",
    explanation: "Let $u = \\tan x$, $du = \\sec^2 x\\,dx$. Then $$\\int \\sec^2 x \\tan x\\,dx = \\int u\\,du = \\frac{u^2}{2} + C = \\frac{\\tan^2 x}{2} + C$$"
  },
  {
    type: "mc",
    chapter: "ch1",
    statement: "Which technique is most appropriate for $$\\int x\\ln x\\,dx$$?",
    choices: [
      "Integration by parts",
      "Trigonometric substitution",
      "Partial fractions",
      "U-substitution alone"
    ],
    correct: "A",
    explanation: "The integrand is a product of $x$ and $\\ln x$. Integration by parts is ideal here with $u = \\ln x$ (whose derivative is simpler) and $dv = x\\,dx$."
  },

  // ==================== CHAPTER 2: Applications of Integration ====================
  {
    type: "mc",
    chapter: "ch2",
    statement: "Find the area between $y = x^2$ and $y = 2x$.",
    choices: [
      "$$\\frac{4}{3}$$",
      "$$\\frac{2}{3}$$",
      "$$\\frac{8}{3}$$",
      "$$2$$"
    ],
    correct: "A",
    explanation: "First find intersection: $x^2 = 2x \\Rightarrow x(x-2) = 0$, so $x = 0$ or $x = 2$. For $0 < x < 2$, we have $2x > x^2$. The area is:\n$$A = \\int_0^2 (2x - x^2)\\,dx = \\left[x^2 - \\frac{x^3}{3}\\right]_0^2 = 4 - \\frac{8}{3} = \\frac{4}{3}$$"
  },
  {
    type: "mc",
    chapter: "ch2",
    statement: "Find the volume when $y = \\sqrt{x}$ from $x=0$ to $x=4$ is revolved about the x-axis.",
    choices: [
      "$$8\\pi$$",
      "$$4\\pi$$",
      "$$16\\pi$$",
      "$$2\\pi$$"
    ],
    correct: "A",
    explanation: "Using the disk method: $V = \\pi \\int_0^4 (\\sqrt{x})^2\\,dx = \\pi \\int_0^4 x\\,dx = \\pi \\left[\\frac{x^2}{2}\\right]_0^4 = \\pi \\cdot 8 = 8\\pi$"
  },
  {
    type: "mc",
    chapter: "ch2",
    statement: "Find the volume using the shell method for $y = x^2$ from $x=0$ to $x=1$ revolved about the y-axis.",
    choices: [
      "$$\\frac{\\pi}{2}$$",
      "$$\\frac{2\\pi}{5}$$",
      "$$\\pi$$",
      "$$\\frac{3\\pi}{2}$$"
    ],
    correct: "A",
    explanation: "Using the shell method: $V = 2\\pi \\int_0^1 x \\cdot x^2\\,dx = 2\\pi \\int_0^1 x^3\\,dx = 2\\pi \\left[\\frac{x^4}{4}\\right]_0^1 = 2\\pi \\cdot \\frac{1}{4} = \\frac{\\pi}{2}$"
  },
  {
    type: "free",
    chapter: "ch2",
    statement: "Find the area between $y = x$ and $y = x^2 - 2$.",
    solution: "Find intersections: $x = x^2 - 2 \\Rightarrow x^2 - x - 2 = 0 \\Rightarrow (x-2)(x+1) = 0$, so $x = -1$ or $x = 2$.\n\nFor $-1 < x < 2$, we have $x > x^2 - 2$ (check at $x=0$: $0 > -2$ ✓).\n\n$$A = \\int_{-1}^2 [x - (x^2-2)]\\,dx = \\int_{-1}^2 (-x^2 + x + 2)\\,dx$$\n$$= \\left[-\\frac{x^3}{3} + \\frac{x^2}{2} + 2x\\right]_{-1}^2$$\n$$= \\left(-\\frac{8}{3} + 2 + 4\\right) - \\left(\\frac{1}{3} + \\frac{1}{2} - 2\\right)$$\n$$= \\frac{10}{3} - \\left(-\\frac{7}{6}\\right) = \\frac{10}{3} + \\frac{7}{6} = \\frac{27}{6} = \\frac{9}{2}$$"
  },
  {
    type: "free",
    chapter: "ch2",
    statement: "Find the volume when the region between $y = x$ and $y = x^2$ (for $0 \\le x \\le 1$) is revolved about the x-axis using the washer method.",
    solution: "The curves intersect at $x = 0$ and $x = 1$ (where $x = x^2$ gives $x = 0$ or $x = 1$). For $0 < x < 1$, we have $x > x^2$.\n\nUsing the washer method with outer radius $R(x) = x$ and inner radius $r(x) = x^2$:\n$$V = \\pi \\int_0^1 [x^2 - (x^2)^2]\\,dx = \\pi \\int_0^1 (x^2 - x^4)\\,dx$$\n$$= \\pi \\left[\\frac{x^3}{3} - \\frac{x^5}{5}\\right]_0^1 = \\pi\\left(\\frac{1}{3} - \\frac{1}{5}\\right) = \\frac{2\\pi}{15}$$"
  },
  {
    type: "free",
    chapter: "ch2",
    statement: "Find the volume when $y = 4 - x^2$ (for $x \\ge 0$) is revolved about the y-axis using the shell method.",
    solution: "The region is bounded by $y = 4 - x^2$ (parabola) and the y-axis. At $y = 0$: $x^2 = 4$, so $x = 2$ (taking positive root).\n\nUsing the shell method:\n$$V = 2\\pi \\int_0^2 x(4 - x^2)\\,dx = 2\\pi \\int_0^2 (4x - x^3)\\,dx$$\n$$= 2\\pi \\left[2x^2 - \\frac{x^4}{4}\\right]_0^2 = 2\\pi\\left(8 - 4\\right) = 8\\pi$$"
  },
  {
    type: "free",
    chapter: "ch2",
    statement: "Find the arc length of $y = \\frac{x^3}{3} + \\frac{1}{4x}$ from $x = 1$ to $x = 2$.",
    solution: "First, find $dy/dx$:\n$$\\frac{dy}{dx} = x^2 - \\frac{1}{4x^2}$$\n\nThen:\n$$\\left(\\frac{dy}{dx}\\right)^2 = x^4 - \\frac{1}{2} + \\frac{1}{16x^4}$$\n\n$$1 + \\left(\\frac{dy}{dx}\\right)^2 = x^4 + \\frac{1}{2} + \\frac{1}{16x^4} = \\left(x^2 + \\frac{1}{4x^2}\\right)^2$$\n\nTherefore:\n$$L = \\int_1^2 \\sqrt{\\left(x^2 + \\frac{1}{4x^2}\\right)^2}\\,dx = \\int_1^2 \\left(x^2 + \\frac{1}{4x^2}\\right)\\,dx$$\n$$= \\left[\\frac{x^3}{3} - \\frac{1}{4x}\\right]_1^2 = \\left(\\frac{8}{3} - \\frac{1}{8}\\right) - \\left(\\frac{1}{3} - \\frac{1}{4}\\right) = \\frac{7}{3} + \\frac{1}{8} = \\frac{59}{24}$$"
  },
  {
    type: "mc",
    chapter: "ch2",
    statement: "The arc length formula for a curve $y = f(x)$ from $x = a$ to $x = b$ is:",
    choices: [
      "$$L = \\int_a^b \\sqrt{1 + [f'(x)]^2}\\,dx$$",
      "$$L = \\int_a^b [f(x)]^2\\,dx$$",
      "$$L = \\int_a^b |f(x)|\\,dx$$",
      "$$L = \\int_a^b f'(x)\\,dx$$"
    ],
    correct: "A",
    explanation: "The arc length formula is derived from the Pythagorean theorem applied to infinitesimal segments. For a curve $y = f(x)$, the arc length element is $ds = \\sqrt{1 + [f'(x)]^2}\\,dx$."
  },
  {
    type: "mc",
    chapter: "ch2",
    statement: "The surface area formula for revolution of $y = f(x)$ about the x-axis is:",
    choices: [
      "$$S = 2\\pi \\int_a^b f(x)\\sqrt{1 + [f'(x)]^2}\\,dx$$",
      "$$S = \\pi \\int_a^b [f(x)]^2\\,dx$$",
      "$$S = \\int_a^b \\sqrt{1 + [f'(x)]^2}\\,dx$$",
      "$$S = 2\\pi \\int_a^b [f(x)]^2\\,dx$$"
    ],
    correct: "A",
    explanation: "The surface area of revolution about the x-axis is found by integrating the circumference $2\\pi y$ times the arc length element $ds = \\sqrt{1 + [f'(x)]^2}\\,dx$."
  },
  {

    solution: "Using the polar area formula:\n$$A = \\frac{1}{2}\\int_0^{2\\pi} (1 + \\sin\\theta)^2 d\\theta$$\n$$= \\frac{1}{2}\\int_0^{2\\pi} (1 + 2\\sin\\theta + \\sin^2\\theta)\\, d\\theta$$\n\nEvaluate each part: $\\int_0^{2\\pi} 1\\,d\\theta = 2\\pi$, $\\int_0^{2\\pi} 2\\sin\\theta\\,d\\theta = 0$, and $\\int_0^{2\\pi} \\sin^2\\theta\\,d\\theta = \\pi$.\n\n$$A = \\frac{1}{2}(2\\pi + 0 + \\pi) = \\frac{3\\pi}{2}$$"

    statement: "Find the arc length of $x = e^t\\cos t, y = e^t\\sin t$ from $t = 0$ to $t = \\pi$.",
    solution: "$$\\frac{dx}{dt} = e^t\\cos t - e^t\\sin t = e^t(\\cos t - \\sin t)$$\n$$\\frac{dy}{dt} = e^t\\sin t + e^t\\cos t = e^t(\\sin t + \\cos t)$$\n\n$$\\left(\\frac{dx}{dt}\\right)^2 + \\left(\\frac{dy}{dt}\\right)^2 = e^{2t}[(\\cos t - \\sin t)^2 + (\\sin t + \\cos t)^2]$$\n$$= e^{2t}[\\cos^2 t - 2\\sin t\\cos t + \\sin^2 t + \\sin^2 t + 2\\sin t\\cos t + \\cos^2 t]$$\n$$= e^{2t} \\cdot 2 = 2e^{2t}$$\n\n$$L = \\int_0^{\\pi} \\sqrt{2e^{2t}}\\, dt = \\sqrt{2}\\int_0^{\\pi} e^t\\, dt = \\sqrt{2}[e^t]_0^{\\pi} = \\sqrt{2}(e^{\\pi} - 1)$$"

/* ── Initialize Page ── */
document.addEventListener('DOMContentLoaded', function() {
  const C = COURSE;

  // Footer
  var f = C.footer;
  document.getElementById('main-footer').innerHTML =
    f.courseName + ' &mdash; ' + f.instructor + '<br>' +
    f.department + ', ' + f.institution + ' &copy; ' + f.year;

  // Build chapter selection grid
  const gridEl = document.getElementById('chapter-select-grid');
  C.examChapters.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chapter-select-btn';
    btn.innerHTML = `<span class="chapter-select-badge">${ch.badge}</span>${ch.title}`;
    btn.dataset.chapter = ch.ch;
    btn.addEventListener('click', function() {
      this.classList.toggle('selected');
      updateSelectedCount();
    });
    gridEl.appendChild(btn);
  });

  // Generate button
  document.getElementById('generate-btn').addEventListener('click', generateExam);

  // KaTeX initialization
  initKaTeX();
});

function updateSelectedCount() {
  const selected = document.querySelectorAll('.chapter-select-btn.selected').length;
  document.getElementById('selected-count').textContent = selected;
}

function generateExam() {
  const selectedBtns = document.querySelectorAll('.chapter-select-btn.selected');
  if (selectedBtns.length === 0) {
    alert('Please select at least one chapter');
    return;
  }

  const selectedChapters = Array.from(selectedBtns).map(btn => btn.dataset.chapter);
  const selected = PROBLEMS.filter(p => selectedChapters.includes(p.chapter));

  if (selected.length === 0) {
    alert('No problems found for selected chapters');
    return;
  }

  // Shuffle
  selected.sort(() => Math.random() - 0.5);

  // Render
  const examEl = document.getElementById('exam-display');
  examEl.innerHTML = '';
  let problemNum = 1;

  selected.forEach(problem => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question-container';
    const qId = 'q' + problemNum;

    let html = `<div class="question-number">Question ${problemNum}</div>`;
    html += `<div class="question-text">${problem.statement}</div>`;

    if (problem.type === 'mc') {
      // Shuffle choices so the correct answer isn't always A
      const letters = ['A', 'B', 'C', 'D'];
      const correctIdx = letters.indexOf(problem.correct);
      const indexedChoices = problem.choices.map((c, i) => ({ text: c, isCorrect: i === correctIdx }));
      // Fisher-Yates shuffle
      for (let i = indexedChoices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexedChoices[i], indexedChoices[j]] = [indexedChoices[j], indexedChoices[i]];
      }
      const newCorrectLetter = letters[indexedChoices.findIndex(c => c.isCorrect)];

      html += `<div class="mc-options" id="${qId}-options">`;
      indexedChoices.forEach((choice, i) => {
        html += `<div class="mc-option" data-letter="${letters[i]}" data-correct="${newCorrectLetter}" data-qid="${qId}" onclick="checkMCAnswer(this)">${letters[i]}) ${choice.text}</div>`;
      });
      html += '</div>';
      html += `<div class="solution-box" id="${qId}-solution"><div class="solution-label">Answer: ${newCorrectLetter}</div><div>${problem.explanation}</div></div>`;
    } else {
      html += `<button class="show-solution-btn" onclick="revealSolution('${qId}')">Show Solution</button>`;
      html += `<div class="solution-box" id="${qId}-solution"><div class="solution-label">Solution:</div><div>${problem.solution}</div></div>`;
    }

    qDiv.innerHTML = html;
    examEl.appendChild(qDiv);
    problemNum++;
  });

  examEl.classList.remove('hidden');

  // Re-render KaTeX
  initKaTeX();

  // Scroll to exam
  examEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function checkMCAnswer(el) {
  if (el.classList.contains('disabled')) return;
  const qId = el.dataset.qid;
  const correct = el.dataset.correct;
  const chosen = el.dataset.letter;
  const options = document.querySelectorAll('#' + qId + '-options .mc-option');

  // Disable all options
  options.forEach(opt => {
    opt.classList.add('disabled');
    if (opt.dataset.letter === correct) {
      opt.classList.add('correct-highlight');
    }
  });

  // Mark the selected answer
  if (chosen === correct) {
    el.classList.add('selected-correct');
  } else {
    el.classList.add('selected-wrong');
  }

  // Reveal solution
  const sol = document.getElementById(qId + '-solution');
  sol.classList.add('visible');
  initKaTeX();
}

function revealSolution(qId) {
  const sol = document.getElementById(qId + '-solution');
  sol.classList.add('visible');
  const btn = sol.previousElementSibling;
  if (btn && btn.classList.contains('show-solution-btn')) {
    btn.style.display = 'none';
  }
  initKaTeX();
}

function initKaTeX() {
  renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true}
    ]
  });
}
